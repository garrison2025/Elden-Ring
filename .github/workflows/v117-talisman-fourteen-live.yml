name: Fourteen Wretch talisman exact real browser profile checks
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/probe-tarnished-talisman-fourteen-v117.mjs
      - .github/workflows/v117-talisman-fourteen-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  talisman-direct-sharded-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
        pass: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure actual selected talisman field effects with naked Wretch 10
        env:
          V117_TALISMAN_SHARD: ${{ matrix.shard }}
          V117_TALISMAN_PASS: ${{ matrix.pass }}
        run: node scripts/probe-tarnished-talisman-fourteen-v117.mjs
      - name: Preserve actual public browser numeric fields
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v117-talisman-shard-${{ matrix.shard }}-pass-${{ matrix.pass }}
          path: .audit/v117-talisman-shard-${{ matrix.shard }}-pass-${{ matrix.pass }}.json
          retention-days: 30
          if-no-files-found: warn
