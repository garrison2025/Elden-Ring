name: Stage-accurate 17 real Tarnished v1.17 Spell golden matches
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download user-pinned v1.17 catalyst parameters and compare ALL 17 double-observed real-site rows
        run: node scripts/check-v117-pebble-independent.mjs
