name: Inspect public Tarnished spell calculation assets without copying code
on:
  pull_request:
    paths:
      - scripts/inspect-tarnished-public-scaling-asset.mjs
      - .github/workflows/inspect-tarnished-public-scaling-asset.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect public served JS resource metadata and short math snippets
        run: node scripts/inspect-tarnished-public-scaling-asset.mjs
