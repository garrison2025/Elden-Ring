name: Double independent Chromium reads of NEW Great Glintstone Shard
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe-tarnished-v117-great-shard.mjs'
      - '.github/workflows/v117-great-shard-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify a DIFFERENT real spell in actual public v1.17 UI
        env:
          TARNISHED_GREAT_SHARD_PASS: ${{ matrix.pass }}
        run: node scripts/probe-tarnished-v117-great-shard.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: great-shard-source-pass-${{ matrix.pass }}
          path: .audit/tarnished-great-shard-v117-pass-${{ matrix.pass }}.json
          retention-days: 30
          if-no-files-found: warn
