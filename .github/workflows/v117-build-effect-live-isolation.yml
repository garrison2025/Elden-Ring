name: Real isolated build effect v1.17 reference cases
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/probe-tarnished-build-effects-v117.mjs
      - .github/workflows/v117-build-effect-live-isolation.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  isolated-live-build-effect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    strategy:
      fail-fast: false
      matrix:
        kind: [talisman, rune, physick]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Select actual item and compare exact unbuffed Wretch fields
        env:
          V117_EFFECT_KIND: ${{ matrix.kind }}
        run: node scripts/probe-tarnished-build-effects-v117.mjs
      - name: Retain UI evidence even if selection fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-v117-build-effect-${{ matrix.kind }}
          path: .audit/v117-build-effect-${{ matrix.kind }}.json
          retention-days: 30
          if-no-files-found: warn
