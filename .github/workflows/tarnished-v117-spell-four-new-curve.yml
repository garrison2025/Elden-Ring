name: Double-check independent spell rounding at 20 35 45 55 INT
on:
  pull_request:
    paths:
      - 'scripts/probe-tarnished-residual-damage-spell-v117.mjs'
      - 'scripts/check-v117-four-new-spell-curve.mjs'
      - '.github/workflows/tarnished-v117-spell-four-new-curve.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        case: [5,6,7,8]
        pass: [1,2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Render actual public Tarnished.dev v1.17 Spell Calculator
        env:
          TARNISHED_RESIDUAL_CASE: ${{ matrix.case }}
          TARNISHED_RESIDUAL_PASS: ${{ matrix.pass }}
        run: node scripts/probe-tarnished-residual-damage-spell-v117.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v117-four-curve-source-${{ matrix.case }}-${{ matrix.pass }}
          path: .audit/tarnished-residual-damage-spell-${{ matrix.case }}-pass-${{ matrix.pass }}.json
          if-no-files-found: error
          retention-days: 14
  evaluate:
    runs-on: ubuntu-latest
    needs: capture
    if: always()
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: v117-four-curve-source-*
          path: .audit
          merge-multiple: true
      - name: Twice-observed actual-site numbers versus source model, keeping mismatches
        run: node scripts/check-v117-four-new-spell-curve.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-v117-new-spell-curve-differences
          path: .audit/v117-pebble-four-new-curve-observations.json
          if-no-files-found: warn
          retention-days: 30
