name: Tarnished.dev v1.17 36 unresolved direct alias weight retry
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/tarnished-v117-weight-unresolved36.mjs
      - scripts/probe-tarnished-item-fields.mjs
      - scripts/compare-tarnished-item-weights.mjs
      - tests/tarnished-v117-weight-unresolved36.test.mjs
      - .github/workflows/tarnished-item-fields.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct-weight-comparison:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0,1,2,3]
    env:
      TARNISHED_WEIGHT_BATCH: '6'
      TARNISHED_WEIGHT_SHARD: ${{ matrix.shard }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read exact public v1.17 single-item inputs - first independent Chromium pass
        run: |
          node scripts/probe-tarnished-item-fields.mjs
          cp .audit/tarnished-public-field-visibility.json .audit/item-field-first.json
      - name: Read exact public v1.17 single-item inputs - second independent Chromium pass
        run: node scripts/probe-tarnished-item-fields.mjs
      - name: Compare independent competitor values with original community weights
        run: node scripts/compare-tarnished-item-weights.mjs
      - name: Preserve full per-shard observations, mismatches and NOT_OBSERVED cases
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-v117-unresolved36-alias-shard-${{ matrix.shard }}
          path: |
            .audit/tarnished-public-field-visibility.json
            .audit/item-field-first.json
            .audit/tarnished-v117-item-weight-comparison.json
          retention-days: 7
          if-no-files-found: warn
