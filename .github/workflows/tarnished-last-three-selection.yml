name: Direct public v1.17 unresolved three weapon activation
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/probe-tarnished-last-three-selection.mjs
      - scripts/probe-tarnished-rh1-options.mjs
      - scripts/tarnished-v117-requirement-candidates.mjs
      - scripts/probe-tarnished-v117-requirements.mjs
      - scripts/compare-tarnished-v117-requirements.mjs
      - .github/workflows/tarnished-last-three-selection.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: First public Chromium site observation
        run: |
          node scripts/probe-tarnished-last-three-selection.mjs
          cp .audit/tarnished-last-three-selection.json .audit/first.json
      - name: Independent second public Chromium observation
        run: node scripts/probe-tarnished-last-three-selection.mjs
      - name: Save raw observations including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarnished-v117-last-three-two-reads
          path: |
            .audit/first.json
            .audit/tarnished-last-three-selection.json
          retention-days: 30
          if-no-files-found: warn

  dropdown-options:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect real public RH1 visible dropdown and option filter
        run: |
          node scripts/probe-tarnished-rh1-options.mjs
          cp .audit/tarnished-rh1-options.json .audit/rh1-first.json
      - name: Recheck independently in a new browser process
        run: node scripts/probe-tarnished-rh1-options.mjs
      - name: Preserve two independent option-list inspections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarnished-v117-rh1-visible-options-two-reads
          path: |
            .audit/rh1-first.json
            .audit/tarnished-rh1-options.json
          retention-days: 30
          if-no-files-found: warn

  great-epee-req:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARNISHED_REQUIREMENT_SHARD: '0'
      TARNISHED_REQUIREMENT_TARGET: great-epee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Direct public v1.17 Great epee Req first browser read
        run: |
          node scripts/probe-tarnished-v117-requirements.mjs
          cp .audit/tarnished-public-requirements.json .audit/req-first.json
      - name: Independently read Great epee Req again
        run: node scripts/probe-tarnished-v117-requirements.mjs
      - name: Require two identical site Req and exact pinned v1.17 comparison
        run: node scripts/compare-tarnished-v117-requirements.mjs
      - name: Retain actual rendered evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tarnished-v117-great-epee-direct-req
          path: |
            .audit/req-first.json
            .audit/tarnished-public-requirements.json
            .audit/requirements-comparison.json
          retention-days: 30
          if-no-files-found: warn
