name: Double-read real Tarnished v1.17 17-point spell scaling curve
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe-tarnished-v117-spell-curve-17.mjs'
      - 'scripts/compare-tarnished-v117-spell-curve-17.mjs'
      - '.github/workflows/tarnished-v117-spell-curve-17.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pass: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Independently read 17 actual live sorcery values
        env:
          TARNISHED_CURVE_PASS: ${{ matrix.pass }}
        run: node scripts/probe-tarnished-v117-spell-curve-17.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-v117-spell-curve-${{ matrix.pass }}
          path: .audit/tarnished-spell-v117-int-curve-pass-${{ matrix.pass }}.json
          retention-days: 30
          if-no-files-found: warn
  compare:
    needs: observe
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: actual-v117-spell-curve-*
          path: .audit
          merge-multiple: true
      - name: Compare 17 same-input genuine source readings with independent math
        run: node scripts/compare-tarnished-v117-spell-curve-17.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: actual-v117-spell-curve-comparison
          path: .audit/spell-curve-17-two-pass-comparison.json
          retention-days: 30
          if-no-files-found: warn
