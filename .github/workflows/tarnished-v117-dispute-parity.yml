name: Targeted Tarnished.dev v1.17 data-conflict parity audit
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/tarnished-v117-disputed-candidates.mjs
      - scripts/probe-tarnished-ui.mjs
      - scripts/compare-tarnished-chrome-ui.mjs
      - scripts/verify-tarnished-dispute-repeats.mjs
      - tests/tarnished-v117-disputed-candidates.test.mjs
      - .github/workflows/tarnished-v117-dispute-parity.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v117-dispute-compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TARNISHED_PROBE_SET: disputes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check public browser availability
        run: command -v google-chrome || command -v google-chrome-stable || command -v chromium
      - name: First independent public-site observation
        run: |
          node scripts/probe-tarnished-ui.mjs
          node scripts/compare-tarnished-chrome-ui.mjs
          cp .audit/tarnished-chrome-comparison.json .audit/dispute-first.json
          cp .audit/tarnished-chrome-ui.json .audit/dispute-first-ui.json
      - name: Second independent public-site observation
        run: |
          node scripts/probe-tarnished-ui.mjs
          node scripts/compare-tarnished-chrome-ui.mjs
      - name: Check repeated observations without silently approving discrepancies
        run: node scripts/verify-tarnished-dispute-repeats.mjs
      - name: Preserve comparator evidence and unresolved fields
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v117-dispute-weapon-2run
          path: |
            .audit/dispute-first.json
            .audit/dispute-first-ui.json
            .audit/tarnished-chrome-comparison.json
            .audit/tarnished-chrome-ui.json
            .audit/tarnished-dispute-repeat-audit.json
          retention-days: 7
          if-no-files-found: warn
