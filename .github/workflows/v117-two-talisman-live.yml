name: Real v1.17 two-talisman combinations twice
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/probe-tarnished-two-talisman-combos-v117.mjs
      - .github/workflows/v117-two-talisman-live.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-two-talisman-selected-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        index: [0, 1, 2, 3]
        pass: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observe two genuine talismans selected on naked Wretch
        env:
          V117_COMBO_INDEX: ${{ matrix.index }}
          V117_COMBO_PASS: ${{ matrix.pass }}
        run: node scripts/probe-tarnished-two-talisman-combos-v117.mjs
      - name: Save real per-selection numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v117-two-talisman-combo-${{ matrix.index }}-pass-${{ matrix.pass }}
          path: .audit/v117-combo-${{ matrix.index }}-pass-${{ matrix.pass }}.json
          retention-days: 30
          if-no-files-found: warn
