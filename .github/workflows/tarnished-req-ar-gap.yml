name: Focused public v1.17 AR-observed requirement gaps
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/tarnished-v117-requirement-candidates.mjs
      - scripts/probe-tarnished-v117-requirements.mjs
      - scripts/compare-tarnished-v117-requirements.mjs
      - .github/workflows/tarnished-req-ar-gap.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0,1]
    env:
      TARNISHED_REQUIREMENT_SHARD: ${{ matrix.shard }}
      TARNISHED_REQUIREMENT_TARGET: ar-gap
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Direct public v1.17 Req first read of already AR-observed names
        run: |
          node scripts/probe-tarnished-v117-requirements.mjs
          cp .audit/tarnished-public-requirements.json .audit/req-first.json
      - name: Independent second public Req read
        run: node scripts/probe-tarnished-v117-requirements.mjs
      - name: Validate paired public DOM requirements vs pinned reference
        run: node scripts/compare-tarnished-v117-requirements.mjs
      - name: Preserve both browser reads and explicit unresolved reasons
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v117-req-ar-gap-shard-${{ matrix.shard }}
          path: |
            .audit/req-first.json
            .audit/tarnished-public-requirements.json
            .audit/requirements-comparison.json
          retention-days: 30
          if-no-files-found: warn
