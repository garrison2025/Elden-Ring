name: Inspect real Tarnished spell target defenses and compare nonzero scenes
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe-tarnished-v117-spell-target-defense.mjs'
      - 'scripts/compare-tarnished-v117-spell-target-defense.mjs'
      - '.github/workflows/v117-spell-target-defense-live.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    strategy:
      fail-fast: false
      matrix:
        pass: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read actual reference UI inputs in a fresh Chromium profile
        env:
          TARNISHED_DEFENSE_PASS: ${{ matrix.pass }}
        run: node scripts/probe-tarnished-v117-spell-target-defense.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spell-target-defense-live-${{ matrix.pass }}
          path: .audit/tarnished-spell-v117-defensive-controls-pass-${{ matrix.pass }}.json
          retention-days: 30
          if-no-files-found: warn
