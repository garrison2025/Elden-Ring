name: Public v1.17 direct Req using lower-stat valid origins
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/tarnished-v117-requirement-candidates.mjs
      - scripts/probe-tarnished-v117-requirements.mjs
      - scripts/compare-tarnished-v117-requirements.mjs
      - .github/workflows/tarnished-req-alt-origin.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: [0,1,2,3,4,5]
    env:
      TARNISHED_REQUIREMENT_SHARD: ${{ matrix.shard }}
      TARNISHED_REQUIREMENT_TARGET: alt-origin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Real v1.17 lower-origin Req first browser observation
        run: |
          node scripts/probe-tarnished-v117-requirements.mjs
          cp .audit/tarnished-public-requirements.json .audit/req-first.json
      - name: Real v1.17 lower-origin Req second independent observation
        run: node scripts/probe-tarnished-v117-requirements.mjs
      - name: Require exact origin/controls/Req agreement and pinned comparison
        run: node scripts/compare-tarnished-v117-requirements.mjs
      - name: Retain both actual DOM observations, including failed selections
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v117-origin-req-shard-${{ matrix.shard }}
          path: |
            .audit/req-first.json
            .audit/tarnished-public-requirements.json
            .audit/requirements-comparison.json
          retention-days: 30
          if-no-files-found: warn
