name: Static site verification
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Validate 17 real Tarnished spell goldens using downloaded pinned regulation v1.17 parameters
        run: node scripts/check-v117-pebble-independent.mjs
      - name: Enforce one-shot final four-engine scope and prevent unverified parity promotion
        run: npm run verify:four-engines
      - name: Verify entirely DIFFERENT spell by live double-Chromium goldens and independent AtkParam
        run: npm run verify:second-sorcery
