name: Final v1.17 weapon minimum requirement provenance audit
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/audit-final-v117-req-provenance.mjs
      - scripts/tarnished-v117-great-epee-direct-req.json
      - scripts/tarnished-v117-requirement-candidates.mjs
      - scripts/probe-tarnished-v117-requirements.mjs
      - scripts/compare-tarnished-v117-requirements.mjs
      - .github/workflows/tarnished-final-requirements.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  great-epee-public:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TARNISHED_REQUIREMENT_SHARD: '0'
      TARNISHED_REQUIREMENT_TARGET: great-epee
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Direct public Great epee Req first independent reading
        run: |
          node scripts/probe-tarnished-v117-requirements.mjs
          cp .audit/tarnished-public-requirements.json .audit/req-first.json
      - name: Direct public Great epee Req second independent reading
        run: node scripts/probe-tarnished-v117-requirements.mjs
      - name: Compare two site reads against pinned v1.17
        run: node scripts/compare-tarnished-v117-requirements.mjs
      - name: Preserve actual rendered observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v117-great-epee-final-two-browser-reads
          path: |
            .audit/req-first.json
            .audit/tarnished-public-requirements.json
            .audit/requirements-comparison.json
          retention-days: 30
          if-no-files-found: warn
  all-487-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile all 487 against pinned v1.17, without reclassifying 27 as direct
        run: node scripts/audit-final-v117-req-provenance.mjs
      - name: Preserve complete per-weapon evidence-tier results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v117-final-all-487-req-provenance
          path: .audit/v117-final-requirement-evidence.json
          retention-days: 30
          if-no-files-found: warn
