name: Verify v1.17 talisman tier selection twice
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/probe-tarnished-talisman-tier-conflicts-v117.mjs'
      - 'scripts/check-tarnished-talisman-tier-conflicts-v117.mjs'
      - '.github/workflows/v117-talisman-tier-conflicts.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        shard: [0, 1, 2, 3]
        pass: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read two selection orders per fresh Chromium process
        env:
          V117_COMBO_SHARD: ${{ matrix.shard }}
          V117_COMBO_PASS: ${{ matrix.pass }}
        run: node scripts/probe-tarnished-talisman-tier-conflicts-v117.mjs
      - name: Preserve original Chromium field snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actual-talisman-tier-${{ matrix.shard }}-${{ matrix.pass }}
          path: .audit/v117-talisman-gate-${{ matrix.shard }}-pass-${{ matrix.pass }}.json
          retention-days: 30
          if-no-files-found: warn
  compare:
    needs: observe
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          pattern: actual-talisman-tier-*
          path: .audit
          merge-multiple: true
      - name: Compare independent source observations, fail if incomplete
        run: node scripts/check-tarnished-talisman-tier-conflicts-v117.mjs
      - name: Publish exact result table on this PR
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if test -f .audit/talisman-gate-audit-comment.md; then
            gh pr comment "$PR_NUMBER" --body-file .audit/talisman-gate-audit-comment.md
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-selector-double-read-comparison
          path: |
            .audit/talisman-gate-audit-summary.json
            .audit/talisman-gate-audit-comment.md
          retention-days: 30
          if-no-files-found: warn
